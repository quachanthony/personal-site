<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Anthony Quach — social preview image source</title>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@800&family=DM+Sans:wght@600&family=Space+Mono&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box}
    body{margin:0;background:#f1f1e7;color:#1c2922}
    .card{position:relative;width:1200px;height:627px;overflow:hidden;border-bottom:12px solid #f04b25}
    .copy{position:absolute;top:54px;left:54px;z-index:1}
    .name{margin:0;font:600 22px 'DM Sans',Arial,sans-serif;letter-spacing:.03em}
    h1{margin:52px 0 28px;font:800 104px/.88 'Barlow Condensed',Impact,sans-serif;letter-spacing:-.02em}
    h1 span{display:block;color:#f04b25;font-size:144px}
    .tagline{margin:0;font:600 20px/1.5 'DM Sans',Arial,sans-serif}
    .url{position:absolute;left:54px;bottom:36px;margin:0;font:16px 'Space Mono',monospace}
    img{position:absolute;right:12px;top:64px;width:730px;height:auto;mix-blend-mode:multiply}
  </style>
</head>
<body>
  <main class="card">
    <div class="copy">
      <p class="name">ANTHONY QUACH</p>
      <h1>I’m a<span>builder.</span></h1>
      <p class="tagline">Software, sawdust,<br>and something for dinner.</p>
    </div>
    <img src="../dist/assets/workbench-reggie-surfboard.webp" width="1536" height="1024" alt="Code, a camper van with Reggie, woodworking, and food">
    <p class="url">anthonyquach.com</p>
  </main>
</body>
</html>
